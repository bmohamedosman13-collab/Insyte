services:
  - type: web
    name: insyte
    runtime: python
    region: oregon

    # Model is downloaded INTO the project directory (.model_cache) so it is
    # baked into the build image and available instantly at runtime — no re-download
    # on cold start.
    buildCommand: >
      pip install -r requirements.txt &&
      python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')" &&
      SENTENCE_TRANSFORMERS_HOME=./.model_cache
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

    startCommand: >
      streamlit run appv2.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection true

    envVars:
      - key: INSYTE_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SENTENCE_TRANSFORMERS_HOME
        value: ./.model_cache

    plan: free
