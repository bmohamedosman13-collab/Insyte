services:
  - type: web
    name: insyte
    runtime: python
    region: oregon

    buildCommand: >
      pip install -r requirements.txt &&
      python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')" &&
      python -c "from fastembed import TextEmbedding; list(TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir='./.model_cache').embed(['warmup']))"

    startCommand: >
      streamlit run appv2.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection true

    envVars:
      - key: INSYTE_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

    plan: free
