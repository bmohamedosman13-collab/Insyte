services:
  - type: web
    name: insyte
    runtime: python
    region: oregon

    # Pre-download the ONNX model into .model_cache during build so it is
    # available on disk at runtime — no download delay on first request.
    # Uses the same absolute path logic as _MODEL_CACHE in appv2.py.
    buildCommand: |
      pip install -r requirements.txt &&
      python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')" &&
      python -c "
      import os
      from fastembed import TextEmbedding
      cache = os.path.join(os.path.dirname(os.path.abspath('appv2.py')), '.model_cache')
      list(TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir=cache).embed(['warmup']))
      print('Model cached at', cache)
      "

    startCommand: >
      streamlit run appv2.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection true

    envVars:
      - key: INSYTE_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

    plan: free
