[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python -c \"import os; from fastembed import TextEmbedding; list(TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir='/app/.model_cache').embed(['warmup'])); print('Model cached.')\""

[deploy]
startCommand = "streamlit run appv2.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.maxUploadSize 15"
restartPolicyType = "on_failure"
