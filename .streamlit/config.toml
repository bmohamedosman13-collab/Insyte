[theme]
base                     = "dark"
primaryColor             = "#C4A8FF"
backgroundColor          = "#2D1B4E"
secondaryBackgroundColor = "#1F1238"
textColor                = "#F2EFF8"
font                     = "sans serif"

[server]
headless             = true
enableCORS           = false
enableXsrfProtection = false
maxUploadSize        = 50

[browser]
gatherUsageStats = false
